worker_processes auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    client_max_body_size 100M;

    server {

        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # =========================
        # HEALTH CHECK
        # =========================
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # =========================
        # DOCUMENT UPLOADS
        # =========================
        location /uploads/ {

            proxy_pass http://document-service-pn.azurewebsites.net/uploads/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # AUTH ROUTES
        # =========================
        location /api/auth/ {

            proxy_pass https://user-service-pn.azurewebsites.net/api/auth/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # USER ROUTES
        # =========================
        location /api/users/ {

            proxy_pass https://user-service-pn.azurewebsites.net/api/users/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # DOCUMENT ROUTES
        # =========================
        location /api/documents/ {

            proxy_pass https://document-service-pn.azurewebsites.net/api/documents/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # ORDER ROUTES
        # =========================
        location /api/orders/ {

            proxy_pass https://order-service-pn.azurewebsites.net/api/orders/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # VENDOR ROUTES
        # =========================
        location /api/vendors/ {

            proxy_pass https://vendor-service-pn.azurewebsites.net/api/vendors/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # FRONTEND REACT/VITE ROUTING
        # =========================
        location / {

            try_files $uri $uri/ /index.html;
        }
    }
}

